<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Total</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #282828;
    color: #ebdbb2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    padding:
        calc(env(safe-area-inset-top) + 5px)
        10px
        env(safe-area-inset-bottom)
        10px;
}

.receipt {
    width: 100%;
    border: 1px solid #504945;
    border-radius: 8px;
    overflow: hidden;
    background: #282828;
}

.header {
    display: grid;
    grid-template-columns: 86px 1fr;
    border-bottom: 1px solid #504945;
    background: #3c3836;
    color: #d5c4a1;
    font-size: 13px;
    font-weight: 600;
}

.header > div:first-child {
    border-right: 1px solid #504945;
    text-align: left;
}

.row {
    display: grid;
    grid-template-columns: 86px 1fr;
    min-height: 32px;
    border-bottom: 1px solid #3c3836;
}

.amount,
.context {
    width: 100%;
    min-width: 0;
    height: 32px;
    border: 0;
    border-radius: 0;
    outline: none;
    background: transparent;
    color: #ebdbb2;
    font-family: inherit;
    font-size: 16px;
    padding: 4px 8px;
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
}

.amount {
    border-right: 1px solid #3c3836;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.amount:focus,
.context:focus {
    background: #3c3836;
}

.total {
    display: flex;
    justify-content: flex-start;
    gap: 12px;
    align-items: center;
    min-height: 38px;
    padding: 7px 8px;
    border-top: 1px solid #504945;
    background: #3c3836;
    color: #ebdbb2;
    font-size: 16px;
    font-weight: 600;
    position: relative;
}

#totalValue {
    color: #b8bb26;
    font-variant-numeric: tabular-nums;
    text-align: right;
}

button {
    border: 0;
    background: transparent;
    color: #928374;
    font: inherit;
    font-size: 13px;
    padding: 6px 4px;
}

#addEntryButton {
    margin-left: auto;
    padding: 3px 6px;
    color: #d79921;
    font-size: 12px;
}

button:active {
    opacity: 0.5;
}

    @media (max-width: 374px) {
        .header,
        .row {
            grid-template-columns: 78px 1fr;
        }

        .amount,
        .context {
            font-size: 15px;
        }
    }
</style>
</head>

<body>
<div id="app">
    <div class="receipt">
        <div class="header">
            <div>Amount</div>
            <div>Context</div>
        </div>

        <div id="rows"></div>

        <div class="total">
            <span>Total</span>
            <span id="totalValue">0</span>
	    <button id="addEntryButton" type="button">add entry</button>
        </div>
    </div>

    <div class="controls">
        <button id="clearButton" type="button">Clear</button>
    </div>
</div>
<script>
	(() => {
    const STORAGE_KEY = "two-column-receipt";
    const INITIAL_ROWS = 12;

    const rowsContainer = document.getElementById("rows");
    const totalValue = document.getElementById("totalValue");
    const clearButton = document.getElementById("clearButton");
    const addEntryButton = document.getElementById("addEntryButton");

    let rows = load();

    function load() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);

            if (!saved) {
                return createEmptyRows(INITIAL_ROWS);
            }

            const parsed = JSON.parse(saved);

            if (!Array.isArray(parsed) || parsed.length === 0) {
                return createEmptyRows(INITIAL_ROWS);
            }

            return parsed;
        } catch {
            return createEmptyRows(INITIAL_ROWS);
        }
    }

    function createEmptyRows(count) {
        return Array.from({ length: count }, () => ({
            amount: "",
            context: ""
        }));
    }

    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
    }

    function render() {
        rowsContainer.innerHTML = "";

        rows.forEach((row, index) => {
            const rowElement = document.createElement("div");
            rowElement.className = "row";

            const amount = document.createElement("input");
            amount.className = "amount";
            amount.type = "text";
            amount.inputMode = "text";
            amount.autocomplete = "off";
            amount.spellcheck = false;
            amount.value = row.amount;
            amount.setAttribute("aria-label", `Amount ${index + 1}`);

            const context = document.createElement("input");
            context.className = "context";
            context.type = "text";
            context.autocomplete = "off";
            context.spellcheck = false;
            context.value = row.context;
            context.setAttribute("aria-label", `Context ${index + 1}`);

            amount.addEventListener("input", () => {
                rows[index].amount = amount.value;
                save();
                updateTotal();
            });

            context.addEventListener("input", () => {
                rows[index].context = context.value;
                save();
            });

            amount.addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    event.preventDefault();
                    context.focus();
                }
            });

            context.addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    event.preventDefault();

                    ensureNextRow(index);

                    const nextAmount = rowsContainer
                        .querySelectorAll(".amount")[index + 1];

                    if (nextAmount) {
                        nextAmount.focus();
                    }
                }
            });

            rowElement.appendChild(amount);
            rowElement.appendChild(context);
            rowsContainer.appendChild(rowElement);
        });

        updateTotal();
    }

    function ensureNextRow(index) {
        if (index + 1 >= rows.length) {
            rows.push({
                amount: "",
                context: ""
            });

            save();
            render();
        }
    }

    function updateTotal() {
        let total = 0;

        for (const row of rows) {
            const value = parseAmount(row.amount);

            if (value !== null) {
                total += value;
            }
        }

        total = Math.round(total * 100) / 100;

        totalValue.textContent = formatNumber(total);
    }

    function parseAmount(value) {
        if (typeof value !== "string") {
            return null;
        }

        const cleaned = value.trim().replace(",", ".");

        if (cleaned === "" || cleaned === "-" || cleaned === ".") {
            return null;
        }

        const number = Number(cleaned);

        return Number.isFinite(number) ? number : null;
    }

    function formatNumber(number) {
        if (Number.isInteger(number)) {
            return number.toString();
        }

        return number.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    addEntryButton.addEventListener("click", () => {
        let targetIndex = rows.findIndex(row =>
            row.amount.trim() === "" &&
            row.context.trim() === ""
        );

        if (targetIndex === -1) {
            rows.push({
                amount: "",
                context: ""
            });

            targetIndex = rows.length - 1;

            save();
            render();
        }

        const amountInputs = rowsContainer.querySelectorAll(".amount");

        if (amountInputs[targetIndex]) {
            amountInputs[targetIndex].focus();
        }
    });

    clearButton.addEventListener("click", () => {
        const hasData = rows.some(
            row => row.amount.trim() !== "" || row.context.trim() !== ""
        );

        if (!hasData) {
            return;
        }

        if (!confirm("Clear everything?")) {
            return;
        }

        rows = createEmptyRows(INITIAL_ROWS);

        save();
        render();

        const firstAmount = rowsContainer.querySelector(".amount");

        if (firstAmount) {
            firstAmount.focus();
        }
    });

    render();
})();
</script>
</body>
</html>
