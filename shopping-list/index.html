<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>list.</title>
<style>
  :root{
    --paper: #282828;
    --paper-alt: #32302f;
    --ink: #ebdbb2;
    --ink-faint: #928374;
    --line: #3c3836;
    --accent: #b8bb26;
    --accent-dim: #98971a;
    --red: #fb4934;
    --red-dim: #cc241d;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body{
    position: fixed;
    inset: 0;
    margin:0;
    height: 100dvh;
    width: 100vw;
    background:var(--paper);
    color:var(--ink);
    font-family: ui-monospace, "SF Mono", "Menlo", "Courier New", monospace;
    display:flex;
    flex-direction:column;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  header{
    padding: max(10px, env(safe-area-inset-top)) 14px 8px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
    background: var(--paper-alt);
  }
  header h1{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin:0;
    color: var(--ink);
  }
  header h1 span{ color: var(--accent); }
  header .count{
    font-size: 10.5px;
    color: var(--ink-faint);
  }

  main{
    flex: 1;
    min-height: 0;
    position: relative;
    touch-action: pan-y;
    overscroll-behavior: contain;
  }

  textarea{
    width:100%;
    height:100%;
    border:none;
    outline:none;
    resize:none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 12px 14px;
    caret-color: var(--accent);
    touch-action: pan-y;
    overscroll-behavior: contain;
    -webkit-user-select: text;
  }
  textarea::placeholder{ color: var(--ink-faint); }

  #listView{
    height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
    padding: 6px 4px 20px 4px;
  }
  #listView.hidden, textarea.hidden{ display:none; }

  .row{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 8px 10px;
    margin: 1px 6px;
    border-radius: 8px;
    transition: background 0.12s ease;
  }
  .row:active{ background: rgba(255,255,255,0.05); }

  .box{
    flex-shrink:0;
    width: 17px;
    height: 17px;
    margin-top: 2px;
    border-radius: 5px;
    border: 1.5px solid var(--ink-faint);
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--paper-alt);
  }
  .row.checked .box{
    background: var(--accent);
    border-color: var(--accent);
  }
  .box svg{
    width: 10px; height:10px;
    opacity:0;
    transition: opacity 0.1s ease;
  }
  .row.checked .box svg{ opacity:1; }

  .label{
    font-size: 13.5px;
    line-height: 1.4;
    padding-top: 0;
    word-break: break-word;
    color: var(--ink);
  }
  .row.checked .label{
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    text-decoration-thickness: 1.5px;
  }

  .heading .label{
    font-weight: 700;
    color: var(--accent);
  }
  .heading .box{ visibility:hidden; }

  .empty{
    padding: 44px 20px;
    text-align:center;
    color: var(--ink-faint);
    font-size: 12.5px;
    line-height:1.6;
  }

  footer{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 8px 12px max(10px, env(safe-area-inset-bottom)) 12px;
    border-top: 1px solid var(--line);
    background: var(--paper-alt);
  }

  button{
    font-family: inherit;
    border: none;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .toggle{
    flex:1;
    display:flex;
    background: var(--line);
    border-radius: 10px;
    padding: 3px;
    gap:3px;
  }
  .toggle button{
    flex:1;
    background: transparent;
    color: var(--ink-faint);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 8px;
    border-radius: 7px;
    transition: all 0.15s ease;
  }
  .toggle button.active{
    background: var(--accent);
    color: var(--paper);
  }

  .clear-btn{
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink-faint);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .clear-btn:active{
    background: rgba(251,73,52,0.12);
    border-color: var(--red-dim);
    color: var(--red);
  }
  .clear-btn svg{ width:15px; height:15px; }

  #confirmBar{
    display:none;
    flex-shrink:0;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding: 8px 12px;
    background: #3c2320;
    border-top: 1px solid var(--red-dim);
    font-size: 12px;
  }
  #confirmBar.show{ display:flex; }
  #confirmBar span{ color: var(--red); flex:1; }
  #confirmBar button{
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight:600;
  }
  #confirmYes{ background: var(--red-dim); color: var(--ink); }
  #confirmNo{ background:transparent; color: var(--red); border:1px solid var(--red-dim); }
</style>
</head>
<body>

<header>
  <h1>list<span>.</span></h1>
  <div class="count" id="count"></div>
</header>

<main>
  <textarea id="editor" placeholder="paste or type your list here
one item per line

lines ending in : become a heading" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
  <div id="listView" class="hidden"></div>
</main>

<div id="confirmBar">
  <span>Delete everything?</span>
  <button id="confirmNo">cancel</button>
  <button id="confirmYes">delete</button>
</div>

<footer>
  <div class="toggle">
    <button id="editBtn" class="active">edit</button>
    <button id="listBtn">list</button>
  </div>
  <button class="clear-btn" id="pasteBtn" title="paste from clipboard" aria-label="paste from clipboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
    </svg>
  </button>
  <button class="clear-btn" id="clearBtn" title="delete everything" aria-label="delete everything">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
      <path d="M10 11v6"></path><path d="M14 11v6"></path>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
    </svg>
  </button>
</footer>

<script>
  const editor = document.getElementById('editor');
  const listView = document.getElementById('listView');
  const editBtn = document.getElementById('editBtn');
  const listBtn = document.getElementById('listBtn');
  const clearBtn = document.getElementById('clearBtn');
  const pasteBtn = document.getElementById('pasteBtn');
  const confirmBar = document.getElementById('confirmBar');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  const countEl = document.getElementById('count');

  // in-memory only: line text -> checked state, keyed by line index+text
  let checkedState = {};

  function lineKey(idx, text){ return idx + '::' + text; }

  function renderList(){
    const lines = editor.value.split('\n');
    listView.innerHTML = '';
    let total = 0, done = 0;
    let hasAny = false;

    lines.forEach((raw, idx) => {
      const text = raw.trim();
      if(text === '') return;
      hasAny = true;

      const isHeading = text.endsWith(':');
      const key = lineKey(idx, text);

      const row = document.createElement('div');
      row.className = 'row' + (isHeading ? ' heading' : '');

      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#282828" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = isHeading ? text.slice(0, -1) : text;

      row.appendChild(box);
      row.appendChild(label);

      if(!isHeading){
        total++;
        if(checkedState[key]){ row.classList.add('checked'); done++; }
        row.addEventListener('click', () => {
          checkedState[key] = !checkedState[key];
          row.classList.toggle('checked');
          updateCount(total, Object.keys(checkedState).filter(k => checkedState[k] && lines.some((l,i)=>lineKey(i,l.trim())===k)).length);
          recount();
        });
      }

      listView.appendChild(row);
    });

    if(!hasAny){
      listView.innerHTML = '<div class="empty">nothing here yet<br>switch to edit and paste your list</div>';
    }

    recount();
  }

  function recount(){
    const boxes = listView.querySelectorAll('.row:not(.heading)');
    const checked = listView.querySelectorAll('.row.checked:not(.heading)');
    if(boxes.length === 0){ countEl.textContent = ''; return; }
    countEl.textContent = checked.length + ' / ' + boxes.length;
  }

  function updateCount(){ /* handled by recount via DOM */ }

  function showEdit(){
    editor.classList.remove('hidden');
    listView.classList.add('hidden');
    editBtn.classList.add('active');
    listBtn.classList.remove('active');
    pasteBtn.style.display = 'flex';
    editor.focus();
  }

  function showList(){
    renderList();
    editor.classList.add('hidden');
    listView.classList.remove('hidden');
    listBtn.classList.add('active');
    editBtn.classList.remove('active');
    pasteBtn.style.display = 'none';
  }

  editBtn.addEventListener('click', showEdit);
  listBtn.addEventListener('click', showList);

  clearBtn.addEventListener('click', () => {
    confirmBar.classList.add('show');
  });
  confirmNo.addEventListener('click', () => {
    confirmBar.classList.remove('show');
  });

  pasteBtn.addEventListener('click', async () => {
    let text = '';
    try{
      text = await navigator.clipboard.readText();
    }catch(err){
      alert('couldn\'t read clipboard — check that this site has clipboard access in Settings, or paste manually with a long-press in the text box.');
      return;
    }
    if(!text) return;

    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const before = editor.value.slice(0, start);
    const after = editor.value.slice(end);
    const insertion = (before.length > 0 ? '\n\n' : '\n') + text;

    editor.value = before + insertion + after;
    const cursorPos = (before + insertion).length;
    editor.focus();
    editor.setSelectionRange(cursorPos, cursorPos);
  });
  confirmYes.addEventListener('click', () => {
    editor.value = '';
    checkedState = {};
    confirmBar.classList.remove('show');
    listView.innerHTML = '';
    countEl.textContent = '';
    showEdit();
  });

  showEdit();
</script>

</body>
</html>
