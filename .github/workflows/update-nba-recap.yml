name: Update NBA Recap

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh following the NBA's overnight games.
    - cron: '17 7,9,11,14,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nba-recap-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare latest NBA data
        run: python scripts/update_nba.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete web-tools site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Allow Pages artifact to become available
        run: sleep 8
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
