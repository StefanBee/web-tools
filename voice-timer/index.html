<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="mobile-web-app-capable" content="yes">
<title>Hold Timer</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1c2024;
    --ink: #f2ede4;
    --muted: #8b9299;
    --accent: #e8a33d;
    --stop: #d1574a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }

  /* ---- Header: timer ---- */
  .header {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6vh;
  }
  .label {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .time {
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.8rem, 15vw, 4.6rem);
    font-weight: 600;
    line-height: 1;
    margin-bottom: 4px;
  }
  .time .ms { font-size: 0.4em; color: var(--muted); }
  .countdown-num {
    font-size: clamp(3.6rem, 20vw, 6rem);
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .status {
    color: var(--muted);
    font-size: 0.95rem;
    min-height: 1.2em;
  }
  .status.running { color: var(--accent); }
  .status.countdown { color: var(--accent); }

  /* ---- Middle: controls row (Start/Reset stack + Voice rocker) ---- */
  .control-row {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    width: 100%;
  }
  .action-stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  button {
    border: none;
    border-radius: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  button:active { transform: scale(0.96); }
  #toggleBtn {
    background: var(--accent);
    color: #201802;
    width: 168px;
    height: 92px;
    font-size: 1.3rem;
  }
  #toggleBtn.running, #toggleBtn.countdown { background: var(--stop); color: #2a0e0a; }
  #resetBtn {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid #33383d;
    width: 168px;
    height: 64px;
    font-size: 1.05rem;
  }
  #resetBtn:disabled { opacity: 0.3; }

  .voice-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .voice-label {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
  .rocker {
    width: 92px;
    height: 172px;
    border-radius: 26px;
    background: var(--panel);
    border: 1px solid #33383d;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .rocker button {
    flex: 1;
    border-radius: 0;
    background: var(--panel);
    color: var(--ink);
    font-size: 2rem;
    font-weight: 400;
    line-height: 1;
  }
  .rocker button:active { background: #262b30; transform: none; }
  #volPlus { border-bottom: none; }
  #volMinus { border-top: none; }
  .rocker-readout {
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    background: #14171a;
    border-top: 1px solid #33383d;
    border-bottom: 1px solid #33383d;
  }

  /* ---- Bottom: get-ready + earbud settings ---- */
  .settings {
    flex: 0 0 auto;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 2vh;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .settings-row input[type="number"] {
    width: 56px;
    background: var(--panel);
    border: 1px solid #33383d;
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.95rem;
    text-align: center;
  }
  input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }

  .diag {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
    min-height: 1.1em;
  }
  .hint {
    color: #565c62;
    font-size: 0.68rem;
    text-align: center;
    line-height: 1.35;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="label" id="labelEl">Hold time</div>
    <div class="time" id="display">00:00<span class="ms">.00</span></div>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="control-row">
    <div class="action-stack">
      <button id="toggleBtn">Start</button>
      <button id="resetBtn" disabled>Reset</button>
    </div>

    <div class="voice-block">
      <span class="voice-label">VOICE</span>
      <div class="rocker">
        <button id="volPlus">+</button>
        <div class="rocker-readout" id="volReadout">5</div>
        <button id="volMinus">−</button>
      </div>
    </div>
  </div>

  <div class="settings">
    <div class="settings-row">
      <span>Get-ready countdown (sec)</span>
      <input type="number" id="prepInput" min="0" max="60" value="10">
    </div>
    <div class="settings-row">
      <span>Earbud button stops timer</span>
      <input type="checkbox" id="earbudToggle" checked>
    </div>
    <div class="diag" id="diag"></div>
    <div class="hint">Add this page to your Home Screen for the most reliable background counting.</div>
  </div>

BgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGCgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgH9/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/fn9/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYKBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAf39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39+f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f39/f3+AgICAgICAgICAgICAgICAgICAgICAgICAgA=="></audio>

<script>
  let phase = 'idle'; // idle | countdown | running | stopped
  let startTime = 0;
  let elapsed = 0;
  let intervalId = null;
  let countdownIntervalId = null;
  let voiceOn = true;
  let voiceLevel = 5; // 1-10
  let lastSpokenSecond = -1;
  let speechWarmed = false;
  let audioCtx = null;

  const display = document.getElementById('display');
  const labelEl = document.getElementById('labelEl');
  const status = document.getElementById('status');
  const toggleBtn = document.getElementById('toggleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const volPlus = document.getElementById('volPlus');
  const volMinus = document.getElementById('volMinus');
  const volReadout = document.getElementById('volReadout');
  const prepInput = document.getElementById('prepInput');
  const earbudToggle = document.getElementById('earbudToggle');
  const diag = document.getElementById('diag');
  const keepAlive = document.getElementById('keepAlive');
  keepAlive.volume = 0.01;

  function showDiag(msg) { diag.textContent = msg; }

  function format(ms) {
    const totalCentis = Math.floor(ms / 10);
    const centis = totalCentis % 100;
    const totalSeconds = Math.floor(ms / 1000);
    const seconds = totalSeconds % 60;
    const minutes = Math.floor(totalSeconds / 60);
    const pad = (n) => String(n).padStart(2, '0');
    if (minutes >= 60) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return { main: `${pad(hours)}:${pad(mins)}:${pad(seconds)}`, ms: pad(centis) };
    }
    return { main: `${pad(minutes)}:${pad(seconds)}`, ms: pad(centis) };
  }

  function renderTime() {
    const now = phase === 'running' ? elapsed + (Date.now() - startTime) : elapsed;
    const { main, ms } = format(now);
    display.innerHTML = `${main}<span class="ms">.${ms}</span>`;
    if (phase === 'running') speakCount(now);
  }

  function warmUpSpeech() {
    if (speechWarmed || !('speechSynthesis' in window)) return;
    speechWarmed = true;
    try {
      window.speechSynthesis.cancel();
      const warm = new SpeechSynthesisUtterance('ready');
      warm.volume = 0.01;
      warm.rate = 3;
      window.speechSynthesis.speak(warm);
    } catch (e) { /* ignore */ }
  }

  function speak(text) {
    if (!voiceOn) return;
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.05;
      utter.volume = voiceLevel / 10;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* ignore */ }
  }

  function speakCount(totalMs) {
    const wholeSecond = Math.floor(totalMs / 1000);
    if (wholeSecond === lastSpokenSecond || wholeSecond === 0) return;
    lastSpokenSecond = wholeSecond;
    if (wholeSecond < 60) {
      speak(String(wholeSecond));
    } else {
      const mins = Math.floor(wholeSecond / 60);
      const secs = wholeSecond % 60;
      speak(secs === 0 ? `${mins} minute${mins === 1 ? '' : 's'}` : String(secs));
    }
  }

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function beep(freq, duration) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration / 1000);
    } catch (e) { /* ignore */ }
  }

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) {
      showDiag('No MediaSession support here \u2014 earbud button won\u2019t reach the timer, but on-screen Stop always works.');
      return;
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Hold Timer',
      artist: 'Tap earbud button to stop',
    });
    try {
      navigator.mediaSession.setActionHandler('pause', () => {
        if (earbudToggle.checked && phase === 'running') stop();
        navigator.mediaSession.playbackState = phase === 'running' ? 'playing' : 'paused';
      });
      navigator.mediaSession.setActionHandler('stop', () => {
        if (earbudToggle.checked && phase === 'running') stop();
      });
      navigator.mediaSession.setActionHandler('play', () => {
        if (earbudToggle.checked && phase === 'idle') beginCountdown();
      });
    } catch (e) {
      showDiag('MediaSession action handlers not supported here.');
    }
  }

  function ensureBackgroundAudio() {
    keepAlive.play().catch(() => {
      showDiag('Background audio didn\u2019t start \u2014 tap Start again.');
    });
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  }

  function beginCountdown() {
    warmUpSpeech();
    getAudioCtx();
    ensureBackgroundAudio();

    const prep = Math.max(0, parseInt(prepInput.value, 10) || 0);
    if (prep <= 0) { start(); return; }

    phase = 'countdown';
    let remaining = prep;
    toggleBtn.textContent = 'Cancel';
    toggleBtn.classList.add('countdown');
    resetBtn.disabled = true;
    labelEl.textContent = 'Get in position';
    status.textContent = 'Starting soon';
    status.classList.add('countdown');
    display.innerHTML = `<span class="countdown-num">${remaining}</span>`;
    speak(String(remaining));

    countdownIntervalId = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(countdownIntervalId);
        display.innerHTML = `<span class="countdown-num">Go</span>`;
        speak('Start');
        setTimeout(() => { start(); }, 350);
      } else {
        display.innerHTML = `<span class="countdown-num">${remaining}</span>`;
        speak(String(remaining));
      }
    }, 1000);
  }

  function cancelCountdown() {
    clearInterval(countdownIntervalId);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    keepAlive.pause();
    phase = 'idle';
    toggleBtn.textContent = 'Start';
    toggleBtn.classList.remove('countdown');
    labelEl.textContent = 'Hold time';
    status.textContent = 'Ready';
    status.classList.remove('countdown');
    resetBtn.disabled = true;
    display.innerHTML = '00:00<span class="ms">.00</span>';
  }

  function start() {
    phase = 'running';
    startTime = Date.now();
    lastSpokenSecond = Math.floor(elapsed / 1000) - 1;
    labelEl.textContent = 'Hold time';
    toggleBtn.textContent = 'Stop';
    toggleBtn.classList.remove('countdown');
    toggleBtn.classList.add('running');
    status.textContent = 'Running';
    status.classList.remove('countdown');
    status.classList.add('running');
    resetBtn.disabled = true;
    beep(880, 90);
    ensureBackgroundAudio();
    intervalId = setInterval(renderTime, 100);
    renderTime();
  }

  function stop() {
    phase = 'stopped';
    elapsed += Date.now() - startTime;
    clearInterval(intervalId);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    keepAlive.pause();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    toggleBtn.textContent = 'Start';
    toggleBtn.classList.remove('running');
    status.textContent = 'Stopped';
    status.classList.remove('running');
    resetBtn.disabled = false;
    beep(440, 140);
    renderTime();
  }

  function reset() {
    elapsed = 0;
    lastSpokenSecond = -1;
    phase = 'idle';
    labelEl.textContent = 'Hold time';
    status.textContent = 'Ready';
    resetBtn.disabled = true;
    renderTime();
  }

  toggleBtn.addEventListener('click', () => {
    if (phase === 'idle' || phase === 'stopped') beginCountdown();
    else if (phase === 'countdown') cancelCountdown();
    else if (phase === 'running') stop();
  });

  resetBtn.addEventListener('click', reset);

  volPlus.addEventListener('click', () => {
    warmUpSpeech();
    voiceLevel = Math.min(10, voiceLevel + 1);
    volReadout.textContent = voiceLevel;
  });
  volMinus.addEventListener('click', () => {
    warmUpSpeech();
    voiceLevel = Math.max(1, voiceLevel - 1);
    volReadout.textContent = voiceLevel;
  });

  setupMediaSession();
  renderTime();
</script>
