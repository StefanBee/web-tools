<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paycheck Calculator</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f6f6f6;
    display:flex;
    justify-content:center;
    padding:40px 15px;
}

.card{
    background:white;
    width:360px;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-top:0;
}

textarea,
input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:10px;
}

textarea{
    height:180px;
    resize:none;
}

label{
    display:block;
    margin:20px 0 8px;
    font-weight:600;
}

.result{
    margin-top:25px;
    font-size:22px;
}

.result div{
    margin:14px 0;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    font-size:20px;
    border:none;
    border-radius:10px;
    background:#e74c3c;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}
</style>

</head>
<body>

<div class="card">

<h1>Paycheck</h1>

<label>Hours</label>

<textarea id="times"
placeholder="8 32
9 11
7 52
8 45
9 03"></textarea>

<label>Hourly Rate ($)</label>

<input id="rate" type="number" step="0.01" placeholder="13">

<div class="result">

<div>
<b>Total Hours:</b>
<span id="total">0h 00m</span>
</div>

<div>
<b>Gross Pay:</b>
<span id="gross">$0.00</span>
</div>

</div>

<button onclick="clearAll()">
Clear
</button>

</div>

<script>

const times=document.getElementById("times");
const rate=document.getElementById("rate");

times.addEventListener("input",calculate);
rate.addEventListener("input",calculate);

function calculate(){

    let totalMinutes=0;

    let lines=times.value.split("\n");

    for(let line of lines){

        line=line.trim();

        if(line==="") continue;

        let parts=line.split(/\s+/);

        if(parts.length<2) continue;

        let h=parseInt(parts[0]);
        let m=parseInt(parts[1]);

        if(isNaN(h)||isNaN(m)) continue;

        totalMinutes+=h*60+m;
    }

    let hours=Math.floor(totalMinutes/60);
    let minutes=totalMinutes%60;

    document.getElementById("total").textContent=
        hours+"h "+String(minutes).padStart(2,"0")+"m";

    let decimalHours=totalMinutes/60;

    let pay=decimalHours*(parseFloat(rate.value)||0);

    document.getElementById("gross").textContent=
        "$"+pay.toFixed(2);

}

function clearAll(){

    times.value="";
    rate.value="";
    calculate();

}

calculate();

</script>

</body>
</html>
