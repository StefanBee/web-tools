<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stefan's Web Tools</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #282828;
    color: #ebdbb2;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 18px;
}
h1 {
    text-align: center;
    font-size: 2.3rem;
    margin-bottom: 8px;
    color: #fabd2f;
}
.subtitle {
    text-align: center;
    color: #a89984;
    margin-bottom: 36px;
    font-size: 1.05rem;
}
.tool {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #3c3836;
    border: 1px solid #504945;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
    transition: transform .2s, border-color .2s;
    margin-bottom: 18px;
}
.tool:hover {
    transform: translateY(-2px);
    border-color: #d79921;
}
.tool-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: #b8bb26;
}
.tool-desc {
    margin-top: 8px;
    color: #a89984;
    font-size: 1.05rem;
}
@media (max-width: 600px) {
    h1 {
        font-size: 2rem;
    }
    .tool {
        padding: 28px;
    }
    .tool-title {
        font-size: 1.6rem;
    }
    .tool-desc {
        font-size: 1.1rem;
    }
}
</style>
</head>
<body>
<div class="container">
<h1>🛠️ Stefan's Web Tools</h1>
<p class="subtitle">
Small tools that make everyday life easier.
</p>
<a class="tool" href="salary-calculator/">
    <div class="tool-title">💰 Salary Calculator</div>
    <div class="tool-desc">
        Calculate worked hours and gross pay.
    </div>
</a>
<a class="tool" href="debt-calc/">
    <div class="tool-title">💰 Debt Calculator</div>
    <div class="tool-desc">
        Calculate how much you owe each other.
    </div>
</a>
<a class="tool" href="quick-tap-timer/">
    <div class="tool-title">⏱️ Quick Tap Timer</div>
    <div class="tool-desc">
        Timer that starts over after 1 tap.
    </div>
</a>
</div>
</body>
</html>
