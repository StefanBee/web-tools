<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stefan's Web Tools</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #282828;
    color: #ebdbb2;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 18px;
}
h1 {
    text-align: center;
    font-size: 2.3rem;
    margin-bottom: 8px;
    color: #fabd2f;
}
.subtitle {
    text-align: center;
    color: #a89984;
    margin-bottom: 36px;
    font-size: 1.05rem;
}
.tool {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #3c3836;
    border: 1px solid #504945;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
    transition: transform .2s, border-color .2s;
    margin-bottom: 18px;
}
.tool:hover {
    transform: translateY(-2px);
    border-color: #d79921;
}
.tool-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: #b8bb26;
}
.tool-desc {
    margin-top: 8px;
    color: #a89984;
    font-size: 1.05rem;
}
.status {
    text-align: center;
    color: #a89984;
    font-size: 0.95rem;
    padding: 20px 0;
}
@media (max-width: 600px) {
    h1 {
        font-size: 2rem;
    }
    .tool {
        padding: 28px;
    }
    .tool-title {
        font-size: 1.6rem;
    }
    .tool-desc {
        font-size: 1.1rem;
    }
}
</style>
</head>
<body>
<div class="container">
<h1>🛠️ Stefan's Web Tools</h1>
<p class="subtitle">
Small tools that make everyday life easier.
</p>
<div id="tools">
    <div class="status">Loading tools…</div>
</div>
</div>

<script>
// ---- Config ----
const GITHUB_OWNER = "StefanBee";
const GITHUB_REPO = "web-tools";
const GITHUB_BRANCH = "main"; // change to "master" if that's your default branch

// Folders to never show as tools (repo plumbing, not actual tools)
const EXCLUDE = new Set([
    ".github", ".git", "assets", "img", "images", "css", "js",
    "node_modules", "shared", "common"
]);

// Default emoji if a tool has no meta.json
const DEFAULT_EMOJI = "🔧";

async function loadTools() {
    const container = document.getElementById("tools");

    let entries;
    try {
        const res = await fetch(
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`
        );
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        entries = await res.json();
    } catch (err) {
        container.innerHTML = `<div class="status">Couldn't load tools (${err.message}). Check back later.</div>`;
        return;
    }

    const folders = entries.filter(
        (e) => e.type === "dir" && !EXCLUDE.has(e.name) && !e.name.startsWith(".")
    );

    if (folders.length === 0) {
        container.innerHTML = `<div class="status">No tools found yet.</div>`;
        return;
    }

    // Fetch optional meta.json for each folder in parallel
    const tools = await Promise.all(
        folders.map(async (folder) => {
            let meta = {};
            try {
                const metaRes = await fetch(
                    `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${folder.name}/meta.json`
                );
                if (metaRes.ok) {
                    meta = await metaRes.json();
                }
            } catch (err) {
                // no meta.json, or bad JSON — fall back silently
            }

            return {
                href: `${folder.name}/`,
                title: meta.title || folder.name,
                desc: meta.desc || "",
                emoji: meta.emoji || DEFAULT_EMOJI,
            };
        })
    );

    // Sort alphabetically by title for a stable order
    tools.sort((a, b) => a.title.localeCompare(b.title));

    container.innerHTML = tools
        .map(
            (tool) => `
        <a class="tool" href="${tool.href}">
            <div class="tool-title">${tool.emoji} ${tool.title}</div>
            ${tool.desc ? `<div class="tool-desc">${tool.desc}</div>` : ""}
        </a>`
        )
        .join("");
}

loadTools();
</script>
</body>
</html>
