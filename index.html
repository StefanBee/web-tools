<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stefan's Web Tools</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #282828;
    color: #ebdbb2;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 18px;
}
h1 {
    text-align: center;
    font-size: 2.3rem;
    margin-bottom: 8px;
    color: #fabd2f;
}
.subtitle {
    text-align: center;
    color: #a89984;
    margin-bottom: 36px;
    font-size: 1.05rem;
}
.tool {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #3c3836;
    border: 1px solid #504945;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
    transition: transform .2s, border-color .2s;
    margin-bottom: 18px;
}
.tool:hover {
    transform: translateY(-2px);
    border-color: #d79921;
}
.tool-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: #b8bb26;
}
.tool-desc {
    margin-top: 8px;
    color: #a89984;
    font-size: 1.05rem;
}
.status {
    text-align: center;
    color: #a89984;
    padding: 20px;
}
@media (max-width: 600px) {
    h1 {
        font-size: 2rem;
    }
    .tool {
        padding: 28px;
    }
    .tool-title {
        font-size: 1.6rem;
    }
    .tool-desc {
        font-size: 1.1rem;
    }
}
</style>
</head>
<body>
<div class="container">
<h1>🛠️ Stefan's Web Tools</h1>
<p class="subtitle">
Small tools that make everyday life easier.
</p>
<div id="tools">
    <p class="status">Loading tools&hellip;</p>
</div>
</div>
<script>
const OWNER = "StefanBee";
const REPO = "web-tools";

async function loadTools() {
    const container = document.getElementById("tools");
    try {
        const res = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/`
        );
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
        const entries = await res.json();
        const dirs = entries.filter(e => e.type === "dir");

        const tools = [];
        await Promise.all(dirs.map(async (dir) => {
            try {
                const metaRes = await fetch(
                    `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${dir.name}/meta.json`
                );
                if (!metaRes.ok) return; // no meta.json, skip this folder
                const meta = await metaRes.json();
                tools.push({
                    path: dir.name,
                    title: meta.title || dir.name,
                    description: meta.description || "",
                    emoji: meta.emoji || "🔧",
                    order: typeof meta.order === "number" ? meta.order : Infinity,
                });
            } catch (e) {
                // folder has no valid meta.json, skip it
            }
        }));

        tools.sort((a, b) => a.order - b.order || a.title.localeCompare(b.title));

        if (tools.length === 0) {
            container.innerHTML = '<p class="status">No tools found.</p>';
            return;
        }

        container.innerHTML = tools.map(t => `
            <a class="tool" href="${t.path}/">
                <div class="tool-title">${t.emoji} ${t.title}</div>
                <div class="tool-desc">${t.description}</div>
            </a>
        `).join("");
    } catch (err) {
        container.innerHTML = '<p class="status">Could not load tools list.</p>';
        console.error(err);
    }
}

loadTools();
</script>
</body>
</html>
