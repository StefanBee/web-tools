<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d2021">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<title>Clock</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d2021;
    overflow: hidden;
    position: fixed;
    inset: 0;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(3vmin, env(safe-area-inset-top))
             max(6vmin, env(safe-area-inset-right))
             max(3vmin, env(safe-area-inset-bottom))
             max(6vmin, env(safe-area-inset-left));
  }

  #time {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0;
    color: #fabd2f;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    /* JetBrains Mono digits run ~0.6em wide each; "12:34:56" is 8 characters,
       so text width ≈ 4.8em. 17vw keeps that snug against the available
       width in portrait; the 40vh ceiling is just a safety cap for extreme
       aspect ratios — width, not height, is the real limit in landscape too,
       so this now actually fills out the wider screen instead of staying
       capped small. */
    font-size: clamp(2.5rem, min(17vw, 40vh), 9rem);
  }

  #pin-btn {
    margin-top: 2vh;
    background: none;
    border: 1px solid #504945;
    color: #665c54;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(0.7rem, 1.6vmin, 0.9rem);
    letter-spacing: 0.04em;
    padding: 0.5em 1.1em;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #pin-btn:active {
    border-color: #665c54;
    color: #928374;
  }

  #pinned {
    margin-top: 1.4vh;
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: #665c54;
    font-size: clamp(0.75rem, 1.8vmin, 1rem);
    letter-spacing: 0.03em;
    visibility: hidden;
  }
</style>
</head>
<body>

  <div id="time">--:--:--</div>
  <button id="pin-btn" type="button">mark time</button>
  <div id="pinned"></div>

<script>
  var el = document.getElementById("time");
  var pinBtn = document.getElementById("pin-btn");
  var pinned = document.getElementById("pinned");
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function tick() {
    var now = new Date();
    el.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    setTimeout(tick, 1000 - now.getMilliseconds()); // lands exactly on each second, no drift
  }
  tick();

  // In-memory only: nothing written to storage, so it's gone on refresh.
  pinBtn.addEventListener("click", function () {
    pinned.textContent = "marked " + el.textContent;
    pinned.style.visibility = "visible";
  });

  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
</script>

</body>
</html>
